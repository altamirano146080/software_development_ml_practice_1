[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "software_development_ml_practice_1"
version = "0.0.1"
description = "Machine learning project focused on data exploration, model training, visualization, and performance evaluation."
authors = [
  { name = "Ruth Altamirano, Malena Chac\u00f3n, Odei Martinez de Morentin" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
dependencies = [
    "black",
    "flake8",
    "huggingface-hub",
    "ipython",
    "isort",
    "jupyterlab",
    "loguru",
    "matplotlib",
    "notebook",
    "numpy",
    "pandas",
    "pyarrow",
    "pip",
    "python-dotenv",
    "scikit-learn",
    "seaborn>=0.13.2",
    "tqdm",
    "typer",
]
requires-python = "~=3.10.0"

[tool.black]
line-length = 99
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
)/
'''

[tool.isort]
profile = "black"
known_first_party = ["software_development_ml_practice_1"]
force_sort_within_sections = true


